<!doctype html>
<meta charset="utf-8">
<title>Canva Lite</title>
<style>
  body { margin: 0; font: 14px system-ui; background: #eef0f3; }
  #bar { display: flex; gap: 6px; padding: 8px; background: #fff; box-shadow: 0 1px 4px #0002; flex-wrap: wrap; align-items: center; }
  button, select { padding: 6px 10px; cursor: pointer; }
  #wrap { display: flex; justify-content: safe center; padding: 20px; overflow: auto; }
  .canvas-container { box-shadow: 0 2px 12px #0003; background: #fff; }
</style>
<div id="bar">
  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>
  <select id="size" onchange="resize(this.value)">
    <option value="900x560">Default 900×560</option>
    <option value="960x540">Slide 960×540</option>
    <option value="1080x1080">Instagram 1080×1080</option>
    <option value="1080x1920">Story 1080×1920</option>
    <option value="794x1123">A4 794×1123</option>
  </select>
  <button onclick="addText()">Text</button>
  <button onclick="add(new fabric.Rect({width:150,height:100}))">Rect</button>
  <button onclick="add(new fabric.Circle({radius:60}))">Circle</button>
  <label><button onclick="img.click()">Image</button><input id="img" type="file" accept="image/*" hidden></label>
  <input id="color" type="color" value="#7c3aed" title="Fill color">
  <input id="bg" type="color" value="#ffffff" title="Background">
  <button onclick="front()">Bring forward</button>
  <button onclick="back()">Send back</button>
  <button onclick="del()">Delete</button>
  <button onclick="save()">Save</button>
  <button onclick="load()">Load</button>
  <button onclick="exportPNG()">Export PNG</button>
</div>
<div id="wrap"><canvas id="c" width="900" height="560"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
const c = new fabric.Canvas('c', { backgroundColor: '#fff', preserveObjectStacking: true });
const $ = id => document.getElementById(id);

const add = o => { o.set({ left: 100, top: 100, fill: $('color').value }); c.add(o).setActiveObject(o); };
const addText = () => add(new fabric.IText('Double-click to edit', { fontSize: 40 }));
const del = () => c.getActiveObjects().forEach(o => c.remove(o)) || c.discardActiveObject().requestRenderAll();
const front = () => c.getActiveObject()?.bringForward();
const back = () => c.getActiveObject()?.sendBackwards();

// History: full-JSON snapshots, fine for small designs. shortcut: upgrade to diffs/patches when designs get heavy.
let hist = [], pos = -1, busy = false;
const snap = () => { if (busy) return; hist = hist.slice(0, pos + 1); hist.push(JSON.stringify(c.toJSON())); pos = hist.length - 1; };
const restore = i => {
  if (i < 0 || i >= hist.length) return;
  busy = true; pos = i;
  c.loadFromJSON(hist[i], () => { c.requestRenderAll(); busy = false; });
};
const undo = () => restore(pos - 1), redo = () => restore(pos + 1);
['object:added', 'object:modified', 'object:removed'].forEach(e => c.on(e, snap));
snap();

// Canvas size is not part of history. shortcut: resizing isn't undoable, add if it bites.
const resize = v => { const [w, h] = v.split('x').map(Number); c.setDimensions({ width: w, height: h }); };

$('color').oninput = e => { const o = c.getActiveObject(); if (o) { o.set('fill', e.target.value); c.requestRenderAll(); } };
$('color').onchange = snap;
$('bg').oninput = e => { c.setBackgroundColor(e.target.value, () => c.requestRenderAll()); };
$('bg').onchange = snap;

$('img').onchange = e => {
  const r = new FileReader();
  r.onload = () => fabric.Image.fromURL(r.result, i => { i.scaleToWidth(300); c.add(i).setActiveObject(i); });
  r.readAsDataURL(e.target.files[0]);
  e.target.value = '';
};

// shortcut: localStorage caps ~5MB so big images won't save, move to a backend/file download when needed
const save = () => localStorage.setItem('design', JSON.stringify(c.toJSON()));
const load = () => {
  const d = localStorage.getItem('design');
  if (!d) return;
  busy = true;
  c.loadFromJSON(d, () => { busy = false; c.requestRenderAll(); snap(); });
};

const exportPNG = () => {
  const a = document.createElement('a');
  a.href = c.toDataURL({ format: 'png', multiplier: 2 });
  a.download = 'design.png';
  a.click();
};

addEventListener('keydown', e => {
  if (c.getActiveObject()?.isEditing) return;
  if (e.key === 'Delete' || e.key === 'Backspace') del();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
});
</script>
